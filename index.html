<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnGoingTest</title>
  <link rel="stylesheet" href="Style/styles.css">
  <script src="Script/script.js" defer></script>
</head>
<body>
  <div id="loading-screen">
    <span id="black-circle">
      <h1 id="loading-text">Loading...</h1>
    </span>
    <div class="spinner-group">
      <div class="spinner-layer opacity-100">
        <span class="spinner-dot" style="--angle: 30deg;"></span>
        <span class="spinner-dot" style="--angle: 120deg;"></span>
        <span class="spinner-dot" style="--angle: 210deg;"></span>
        <span class="spinner-dot" style="--angle: 300deg;"></span>
      </div>
      <div class="spinner-layer opacity-75">
        <span class="spinner-dot" style="--angle: 20deg;"></span>
        <span class="spinner-dot" style="--angle: 110deg;"></span>
        <span class="spinner-dot" style="--angle: 200deg;"></span>
        <span class="spinner-dot" style="--angle: 290deg;"></span>
      </div>
      <div class="spinner-layer opacity-50">
        <span class="spinner-dot" style="--angle: 10deg;"></span>
        <span class="spinner-dot" style="--angle: 100deg;"></span>
        <span class="spinner-dot" style="--angle: 190deg;"></span>
        <span class="spinner-dot" style="--angle: 280deg;"></span>
      </div>
      <div class="spinner-layer opacity-25">
        <span class="spinner-dot" style="--angle: 0deg;"></span>
        <span class="spinner-dot" style="--angle: 90deg;"></span>
        <span class="spinner-dot" style="--angle: 180deg;"></span>
        <span class="spinner-dot" style="--angle: 270deg;"></span>
      </div>
    </div>
  </div>

  <main class="content" role="main">
    <div class="page center">
    </div>
  </main>

</body>
</html>
