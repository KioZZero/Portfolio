<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="page_title_projects">My Projects</title>
  <link rel="stylesheet" href="../Style/core.css">
  <link rel="stylesheet" href="../Style/modules.css">
  <link rel="stylesheet" href="../Style/pages.css">
  <script src="../Script/moduleLoader.js"></script>
  <script src="../Script/modules.js"></script>
  <script src="../Script/dateScript.js"></script>
  <script src="../Script/translationScript.js"></script>
  <script src="../Script/introOverlay.js" defer></script>
  <script src="../Script/projectRenderer.js" defer></script>
</head>
<body>
  <div id="intro-overlay"></div>
  <header>
    <h1 data-i18n="page_title_projects">Projects</h1>
    <div id="toggles-container">
      <button class="toggle-button" title="Links" aria-label="Links" data-i18n-title="toggle_links" data-i18n-aria-label="toggle_links" onclick="toggleSidebarModule()"><span class="toggle-icon" aria-hidden="true"><img src="../Resources/placeholder-link.png" alt="Links" data-i18n-alt="toggle_links"></span></button>
      <button class="toggle-button" title="Themes" aria-label="Themes" data-i18n-title="toggle_themes" data-i18n-aria-label="toggle_themes" onclick="toggleThemeModule()"><span class="toggle-icon" aria-hidden="true"><img src="../Resources/placeholder-theme.png" alt="Themes" data-i18n-alt="toggle_themes"></span></button>
      <button class="toggle-button" title="Languages" aria-label="Languages" data-i18n-title="toggle_languages" data-i18n-aria-label="toggle_languages" onclick="toggleLanguageModule()"><span class="toggle-icon" aria-hidden="true"><img src="../Resources/placeholder-language.png" alt="Languages" data-i18n-alt="toggle_languages"></span></button>
    </div>
  </header>

  <section id="modules-container">
    <div id="sidebar-module-container"></div>
    <div id="theme-module-container"></div>
    <div id="language-module-container"></div>
  </section>

  <main class="projects-page-content">
    <a class="page-link" href="../index.html" data-i18n="back_to_home">Back to home</a>

    <section class="projects-grid" id="projects-grid">
      <div id="projects-loader" class="projects-loader" aria-hidden="false">
        <div class="spinner" aria-hidden="true"></div>
        <div class="loader-text" data-i18n="loading_projects">Loading projects…</div>
      </div>
    </section>
  </main>

  <footer>
    <p id="actualDate"></p>
  </footer>
</body>
</html>
